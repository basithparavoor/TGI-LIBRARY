<header style="display: flex; justify-content: space-between; align-items: center; padding: 0 1.5rem; background: var(--bg-glass-strong); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 80; height: var(--topbar-height); transition: background-color var(--transition-normal), border-color var(--transition-normal);">
    
    <div style="display: flex; align-items: center; gap: 1rem;">
        <!-- Mobile Hamburger Menu -->
        <button id="mobile-menu-btn" class="btn btn-ghost btn-icon" style="display: none; padding: 0.4rem;" aria-label="Toggle menu">
            <i data-lucide="menu" style="width: 22px; height: 22px;"></i>
        </button>

        <!-- Branding / Page Title -->
        <div id="topbar-title" style="display: flex; align-items: center; gap: 0.75rem;">
            <div style="width: 32px; height: 32px; border-radius: 8px; background: var(--brand-gradient); display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 2px 8px var(--brand-glow);">
                <i data-lucide="library" style="width: 18px; height: 18px;"></i>
            </div>
            <div>
                <h2 style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin: 0; letter-spacing: -0.01em;">TGI LIBRARY</h2>
                <div style="display: flex; align-items: center; gap: 0.4rem;">
                    <span class="badge-dot" style="background: var(--success); width: 6px; height: 6px;"></span>
                    <span style="font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Cloud Connected</span>
                </div>
            </div>
        </div>
    </div>

    <div class="header-actions" style="display: flex; align-items: center; gap: 0.75rem;">
        <!-- Search Shortcut Hint -->
        <button class="btn btn-outline" style="display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0.85rem; border-color: var(--border-color); background: var(--bg-surface); border-radius: var(--radius-full); box-shadow: var(--shadow-xs);" onclick="window.toggleCommandPalette()">
            <i data-lucide="search" style="width: 15px; height: 15px; color: var(--text-secondary);"></i> 
            <span class="topbar-search-text" style="font-size: 0.825rem; color: var(--text-secondary); font-weight: 500;">Quick Search...</span> 
            <kbd style="background: var(--bg-muted); color: var(--text-muted); padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; border: 1px solid var(--border-color);">Ctrl K</kbd>
        </button>

        <!-- Live Clock Pill -->
        <div id="topbar-clock" style="display: none; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); background: var(--bg-muted); padding: 0.35rem 0.75rem; border-radius: var(--radius-full); border: 1px solid var(--border-color); font-family: var(--font-mono);">
            --:--:--
        </div>

        <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 0.25rem;"></div>

        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="btn btn-ghost btn-icon" title="Toggle Theme" style="border-radius: 50%;">
            <i data-lucide="moon" style="width: 18px; height: 18px;"></i>
        </button>

        <!-- User Profile Dropdown -->
        <div class="user-profile" style="display: flex; align-items: center; gap: 0.65rem; padding: 0.3rem 0.6rem; border-radius: var(--radius-full); background: var(--bg-muted); border: 1px solid var(--border-color); cursor: pointer; transition: all var(--transition-fast);">
            <div id="topbar-user-avatar" style="width: 28px; height: 28px; border-radius: 50%; background: var(--brand-gradient); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; box-shadow: 0 2px 6px var(--brand-glow);">
                A
            </div>
            <div class="user-info-text" style="text-align: left; padding-right: 0.25rem;">
                <p id="topbar-user-name" style="font-size: 0.8rem; font-weight: 700; margin: 0; line-height: 1.2; color: var(--text-primary);">Admin</p>
                <p id="topbar-user-role" style="font-size: 0.65rem; color: var(--brand-primary); margin: 0; font-weight: 600; text-transform: uppercase;">Super Admin</p>
            </div>
        </div>

        <!-- Logout Button -->
        <button id="logout-btn" class="btn btn-ghost btn-icon" title="Sign Out" style="color: var(--danger); border-radius: 50%;">
            <i data-lucide="log-out" style="width: 18px; height: 18px;"></i>
        </button>
    </div>
    
    <style>
        @media (min-width: 900px) {
            #topbar-clock { display: block !important; }
        }
        @media (max-width: 768px) {
            #mobile-menu-btn { display: flex !important; }
            .user-info-text { display: none !important; }
            .topbar-search-text { display: none !important; }
            #topbar-title h2 { display: none !important; }
        }
    </style>
</header>
