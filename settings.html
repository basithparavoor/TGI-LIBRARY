<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - TGI LIBRARY</title>
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="components.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .tab-btn.active {
            background: rgba(37, 99, 235, 0.1);
            border-color: var(--brand-primary);
            color: var(--brand-primary);
            font-weight: 600;
        }
        .tab-btn { border-color: transparent; color: var(--text-secondary); transition: all var(--transition-fast); }
        .tab-btn:hover:not(.active) { background: var(--bg-primary); border-color: var(--border-color); }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            <div id="topbar-container"></div>
            
            <main class="main-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <h1>System Settings</h1>
                        <p style="color: var(--text-secondary);">Configure library rules and manage master data hierarchies.</p>
                    </div>
                </div>

                <!-- Tabs -->
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                    <button class="btn tab-btn active" data-target="panel-general">General Rules</button>
                    <button class="btn tab-btn" data-target="panel-master-data">Master Data</button>
                </div>

                <!-- PANEL 1: GENERAL SETTINGS -->
                <div id="panel-general" class="card card-glass tab-panel" style="display: block;">
                    <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">Circulation Rules</h2>
                    <form id="settings-form">
                        <div class="responsive-grid-2">
                            <div class="input-group">
                                <label>Default Loan Period (Days)</label>
                                <input type="number" id="setting-loan-days" value="14" required>
                            </div>
                            <div class="input-group">
                                <label>Overdue Fine (₹ per day)</label>
                                <input type="number" id="setting-fine-amount" step="0.5" value="2.00" required>
                            </div>
                            <div class="input-group">
                                <label>Maximum Books per Student</label>
                                <input type="number" id="setting-max-books" value="3" required>
                            </div>
                            <div class="input-group">
                                <label>Maximum Renewals Allowed</label>
                                <input type="number" id="setting-max-renewals" value="1" required>
                            </div>
                        </div>
                        <div style="margin-top: 1.5rem; text-align: right;">
                            <button type="submit" class="btn btn-primary" id="btn-save-settings">Save Settings</button>
                        </div>
                    </form>
                </div>

                <!-- PANEL 2: MASTER DATA -->
                <div id="panel-master-data" class="card card-glass tab-panel" style="display: none;">
                    <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">Master Data Hierarchy</h2>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
                        <!-- Academic Structure -->
                        <div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                                <h3 style="font-size: 1rem;">Academic Departments</h3>
                                <button class="btn btn-primary btn-sm" onclick="addParentEntity('Department', 'departments')"><i data-lucide="plus" style="width: 16px;"></i> New Dept</button>
                            </div>
                            <div id="tree-academic" style="max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem;">
                                <div style="padding: 1rem; text-align: center; color: var(--text-secondary);">Loading...</div>
                            </div>
                        </div>

                        <!-- Physical Locations -->
                        <div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                                <h3 style="font-size: 1rem;">Library Locations</h3>
                                <button class="btn btn-primary btn-sm" onclick="addParentEntity('Shelf', 'shelves')"><i data-lucide="plus" style="width: 16px;"></i> New Shelf</button>
                            </div>
                            <div id="tree-locations" style="max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem;">
                                <div style="padding: 1rem; text-align: center; color: var(--text-secondary);">Loading...</div>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>lucide.createIcons();</script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="ui.js"></script>
    <script type="module" src="settings.js"></script>
</body>
</html>
