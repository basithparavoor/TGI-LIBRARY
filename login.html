<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Premium LMS</title>
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="main.css">
    <style>
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg-primary);
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
        }
        .auth-card h1 { margin-bottom: 0.5rem; }
        .auth-card p { color: var(--text-secondary); margin-bottom: 2rem; }
        .error-toast { 
            color: var(--danger); 
            background: #fef2f2; 
            padding: 0.75rem; 
            border-radius: var(--radius); 
            margin-bottom: 1rem; 
            display: none; 
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="card auth-card">
            <h1>Welcome Back</h1>
            <p>Sign in to the Library Management System</p>
            
            <div id="error-message" class="error-toast"></div>

            <form id="login-form">
                <div class="input-group" style="text-align: left;">
                    <label style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.5rem; display: block;">Email Address</label>
                    <input type="email" id="email" required placeholder="admin@institute.edu">
                </div>
                <div class="input-group" style="text-align: left; margin-bottom: 1.5rem;">
                    <label style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.5rem; display: block;">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;" id="login-btn">Sign In</button>
            </form>
        </div>
    </div>
    <script type="module" src="auth.js"></script>
</body>
</html>
