<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TGI LIBRARY</title>
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="components.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;">
            <div id="topbar-container"></div>
            
            <main class="main-content">
                <div style="margin-bottom: 2rem;">
                    <h1>Dashboard Overview</h1>
                    <p style="color: var(--text-secondary);">Welcome back. Here is what is happening in the library today.</p>
                </div>

                <!-- Dashboard Stats -->
                <div class="stats-grid">
                    <div class="card card-glass stat-card">
                        <h3 style="color: var(--text-secondary); font-size: 0.875rem; text-transform: uppercase; font-weight: 600;">Total Books</h3>
                        <p id="stat-total-books" style="font-size: 2rem; font-weight: 700; margin-top: 0.5rem;">...</p>
                    </div>
                    <div class="card card-glass stat-card">
                        <h3 style="color: var(--text-secondary); font-size: 0.875rem; text-transform: uppercase; font-weight: 600;">Active Issues</h3>
                        <p id="stat-active-issues" style="font-size: 2rem; font-weight: 700; margin-top: 0.5rem; color: var(--brand-primary);">...</p>
                    </div>
                    <div class="card card-glass stat-card">
                        <h3 style="color: var(--text-secondary); font-size: 0.875rem; text-transform: uppercase; font-weight: 600;">Overdue Books</h3>
                        <p id="stat-overdue" style="font-size: 2rem; font-weight: 700; margin-top: 0.5rem; color: var(--danger);">...</p>
                    </div>
                </div>

                <div class="responsive-grid-2">
                    <!-- Circulation Chart -->
                    <div class="card card-glass" style="min-height: 300px; display: flex; flex-direction: column;">
                        <h3 style="margin-bottom: 1rem; font-size: 1rem;">Circulation Trends</h3>
                        <div style="flex: 1; position: relative;">
                            <canvas id="circulationChart"></canvas>
                        </div>
                    </div>

                    <!-- Command Center -->
                    <div class="card card-glass">
                        <h3 style="margin-bottom: 1rem; font-size: 1rem;">Quick Action</h3>
                        <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1rem;">
                            Press <kbd style="background: var(--bg-primary); padding: 0.1rem 0.4rem; border-radius: 4px; border: 1px solid var(--border-color);">Ctrl K</kbd> anywhere to open the command palette.
                        </p>
                        <div class="input-group" style="margin-top: 1rem; position: relative;">
                            <i data-lucide="search" style="position: absolute; left: 1rem; top: 0.85rem; color: var(--text-secondary); width: 18px;"></i>
                            <input type="text" id="command-input" placeholder="Search anything..." style="padding-left: 3rem;">
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Command Palette Overlay -->
    <div id="command-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; align-items: flex-start; justify-content: center; padding-top: 10vh;">
        <div class="card card-glass" style="width: 100%; max-width: 600px; padding: 0; overflow: hidden; display: flex; flex-direction: column; margin: 0 1rem;">
            <div class="input-group" style="margin: 0; position: relative; border-bottom: 1px solid var(--border-color);">
                <i data-lucide="search" style="position: absolute; left: 1.5rem; top: 1.25rem; color: var(--text-secondary); width: 24px; height: 24px;"></i>
                <input type="text" id="global-search-input" placeholder="Search books, students..." style="width: 100%; padding: 1.25rem 1.25rem 1.25rem 4rem; border: none; font-size: 1.1rem; background: transparent; outline: none; color: var(--text-primary);">
            </div>
            
            <div id="command-results" style="max-height: 400px; overflow-y: auto; padding: 0.5rem;">
                <div class="cmd-item" onclick="window.location.href='circulation.html'">
                    <i data-lucide="repeat"></i> <span>Go to Circulation Desk</span>
                </div>
                <div class="cmd-item" onclick="window.location.href='books.html'">
                    <i data-lucide="book-plus"></i> <span>Add New Book</span>
                </div>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="dashboard.js"></script>
    <script type="module" src="ui.js"></script>
</body>
</html>
